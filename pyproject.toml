[project]
name = "acp"
version = "0.1.0"
description = "Which software practices help a coding agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acp = "acp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: creates real environments and hits the network, not run by default",
    "docker: needs a working Docker daemon on top of that",
]
addopts = "-m 'not integration'"
