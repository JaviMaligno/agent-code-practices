[project]
name = "acp"
version = "0.1.0"
description = "Which software practices help a coding agent"
requires-python = ">=3.11"
# LibCST porque las transformaciones tienen que editar sin reescribir: si A4 se
# llevara por delante el formato o A1 los comentarios, el efecto medido dejaría
# de ser atribuible a una sola práctica. Instalar siempre desde wheel
# (`pip install --only-binary :all: libcst`): compilarlo pide toolchain de Rust.
dependencies = ["libcst>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
acp = "acp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: creates real environments and hits the network, not run by default",
    "docker: needs a working Docker daemon on top of that",
]
addopts = "-m 'not integration'"
